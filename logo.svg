<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="brandGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  
  <!-- Icon Emblem -->
  <g transform="translate(10, 8)">
    <!-- Hexagonal / Shield Badge -->
    <path d="M32 4 L58 18 L58 46 L32 60 L6 46 L6 18 Z" fill="url(#shieldGrad)" stroke="url(#brandGold)" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Crossed Tools & Checkmark inside badge -->
    <!-- Wrench -->
    <path d="M22 20 L27 25 L41 39 A4 4 0 0 1 39 41 L25 27 L20 22 Z" fill="#FBBF24" />
    <circle cx="21" cy="21" r="5" fill="none" stroke="#FBBF24" stroke-width="2" />
    
    <!-- Hammer / Measure Accent -->
    <path d="M42 20 L37 25 L23 39 A4 4 0 0 0 25 41 L39 27 L44 22 Z" fill="#FFFFFF" opacity="0.9" />
    <rect x="38" y="16" width="10" height="6" rx="1.5" fill="#FBBF24" transform="rotate(45 43 19)" />
    
    <!-- Small star or accent at center -->
    <circle cx="32" cy="48" r="3" fill="#FBBF24" />
  </g>

  <!-- Typography -->
  <g transform="translate(82, 14)">
    <text x="0" y="24" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#0F172A" letter-spacing="-0.5">
      WHAT YA GOT<tspan fill="#D97706">?</tspan>
    </text>
    <text x="0" y="42" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#475569" letter-spacing="2.5">
      HANDYMAN SERVICES
    </text>
    <text x="0" y="55" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" fill="#166534" letter-spacing="1.2">
      📍 CAIRNS &amp; SURROUNDS • QLD
    </text>
  </g>
</svg>
